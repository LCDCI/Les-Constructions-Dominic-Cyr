<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service temporairement indisponible - Les Constructions Dominic Cyr</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
            border-top: 4px solid #aab2a6;
        }

        .error-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: #aab2a6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .error-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
        }

        h1 {
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .error-message {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .error-submessage {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .retry-button {
            background: #aab2a6;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .retry-button:hover {
            background: #8a9286;
            box-shadow: 0 4px 12px rgba(170, 178, 166, 0.3);
            transform: translateY(-2px);
        }

        .status-info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .error-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 24px;
            }

            .error-message {
                font-size: 15px;
            }

            .error-icon {
                width: 80px;
                height: 80px;
            }

            .error-icon svg {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>
        
        <h1>Service temporairement indisponible</h1>
        
        <p class="error-message">
            Nous rencontrons actuellement des problèmes avec le serveur. Notre équipe travaille à les résoudre le plus rapidement possible.
        </p>
        
        <p class="error-submessage">
            Veuillez réessayer dans quelques minutes. Nous nous excusons des inconvénients que cette situation pourrait causer.
        </p>
        
        <button class="retry-button" onclick="goHome()">
            Retour à l'accueil
        </button>
    </div>

    <script>
        // Configuration des nouvelles tentatives automatiques
        const RETRY_INTERVAL_MS = 30000; // 30 secondes
        const MAX_RETRIES = 3;
        const COOLDOWN_PERIOD_MS = 3600000; // 1 heure avant la réinitialisation du compteur
        const RETRY_STORAGE_KEY = 'lcdci_error_retry_count';
        const RETRY_TIMESTAMP_KEY = 'lcdci_error_retry_timestamp';

        function updateStatus(message) {
            const statusMessage = document.getElementById('status-message');
            if (statusMessage) {
                statusMessage.textContent = message;
            }
        }

        function goHome() {
            try {
                window.location.assign('/');
            } catch (navigationError) {
                try {
                    window.location.href = `${window.location.origin}/`;
                } catch (fallbackError) {
                    updateStatus(
                        "La page d'accueil n'a pas pu être ouverte. Veuillez utiliser l'adresse https://constructions-dominiccyr.com."
                    );
                }
            }
        }

        function getRetryData() {
            try {
                const count = Number.parseInt(
                    localStorage.getItem(RETRY_STORAGE_KEY),
                    10
                );
                const timestamp = Number.parseInt(
                    localStorage.getItem(RETRY_TIMESTAMP_KEY),
                    10
                );

                // Réinitialiser si les données sont invalides ou si la période d'attente est écoulée
                const now = Date.now();
                if (
                    !Number.isFinite(count) ||
                    count < 0 ||
                    !Number.isFinite(timestamp) ||
                    now - timestamp > COOLDOWN_PERIOD_MS
                ) {
                    return { count: 0, shouldReset: true };
                }

                return { count, shouldReset: false };
            } catch (storageError) {
                updateStatus(
                    "Les nouvelles tentatives automatiques sont indisponibles. Veuillez revenir à l'accueil ou réessayer plus tard."
                );
                return null;
            }
        }

        function setRetryData(count) {
            try {
                localStorage.setItem(RETRY_STORAGE_KEY, String(count));
                localStorage.setItem(RETRY_TIMESTAMP_KEY, String(Date.now()));
                return true;
            } catch (storageError) {
                updateStatus(
                    "Les nouvelles tentatives automatiques sont indisponibles. Veuillez revenir à l'accueil ou réessayer plus tard."
                );
                return false;
            }
        }

        function autoRetry() {
            const retryData = getRetryData();
            if (!retryData) {
                return;
            }

            if (retryData.shouldReset) {
                // Réinitialiser et recommencer
                if (setRetryData(1)) {
                    window.location.reload();
                }
            } else if (retryData.count < MAX_RETRIES) {
                const nextCount = retryData.count + 1;
                if (setRetryData(nextCount)) {
                    window.location.reload();
                }
            } else {
                updateStatus(
                    "Le nombre maximal de tentatives a été atteint. Veuillez revenir à l'accueil ou réessayer dans une heure."
                );
            }
        }

        // Démarrer les nouvelles tentatives après l’intervalle configuré
        try {
            window.setTimeout(autoRetry, RETRY_INTERVAL_MS);
        } catch (timerError) {
            updateStatus(
                "La nouvelle tentative automatique est indisponible. Veuillez revenir à l'accueil ou réessayer plus tard."
            );
        }
    </script>
</body>
</html>
